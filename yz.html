<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>验证</title>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #FFFFFF;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        .yz-page {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #FFFFFF;
        }

        /*
            22 / 23 / 24
            没有任何切换动画
        */
        .yz-base-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            z-index: 1;

            pointer-events: none;

            user-select: none;
            -webkit-user-drag: none;
        }

        /*
            25.png
            初始在屏幕右边
        */
        .yz-final-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            z-index: 2;

            transform: translateX(100%);

            will-change: transform;

            pointer-events: none;

            user-select: none;
            -webkit-user-drag: none;
        }

        /*
            第四张出现时
            从右向左滑入
        */
        .yz-final-image.show {
            transform: translateX(0);

            transition:
                transform 0.34s cubic-bezier(.22, 1, .36, 1);
        }

        /*
            25.png 上的透明按钮区域

            测试阶段：
            先用红色显示

            正式使用时把：
            background: rgba(255, 0, 0, 0.35);

            改成：
            background: transparent;
        */
        .yz-test-button {
            position: fixed;

            left: 50%;
            bottom: calc(85px + env(safe-area-inset-bottom));

            transform: translateX(-50%);

            width: 80%;
            height: 56px;

            z-index: 10;

            border: 0;
            border-radius: 12px;

            background: transparent;

            display: none;

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color:
                transparent;
        }

        /*
            等 25.png 出现后
            再显示按钮
        */
        .yz-test-button.show {
            display: block;
        }

        .yz2-transition-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: #FFFFFF;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.36s cubic-bezier(.22, 1, .36, 1);
            will-change: transform;
        }

        .yz2-transition-layer.show {
            transform: translateY(0);
        }

        .yz-loading-video {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 140px;
            height: 180px;
            transform: translate(-50%, -50%);
            object-fit: contain;
            display: none;
            z-index: 40;
            pointer-events: none;
            background: transparent;
        }

        .yz-loading-video.show {
            display: block;
        }

        @media (display-mode: standalone) {

            html,
            body {
                width: 100%;
                height: 100vh;
                min-height: 100vh;

                margin: 0;

                overflow: hidden;
            }

            body {
                position: fixed;
                inset: 0;
            }

            .yz-page {
                position: fixed;
                inset: 0;

                width: 100%;
                height: 100vh;
            }
        }
    </style>
</head>

<body>

    <main class="yz-page">

        <!--
            22 → 23 → 24
            共用这一张 img，直接替换 src
            所以前三张完全没有切换动画
        -->
        <img class="yz-base-image" id="yzBaseImage" src="img/sy/22.png" alt="">

        <!--
            第四张单独一层，
            用来实现从右向左滑入
        -->
        <img class="yz-final-image" id="yzFinalImage" src="img/sy/25.png" alt="">

        <!--
            测试按钮
            目前故意涂成红色
        -->
        <button class="yz-test-button" id="yzTestButton" type="button" aria-label="测试按钮"></button>

        <video
            class="yz-loading-video"
            id="yzLoadingVideo"
            src="img/sy/27.mp4"
            muted
            playsinline
            preload="auto">
        </video>

    </main>

    <script>
        const yzBaseImage =
            document.getElementById(
                "yzBaseImage"
            );

        const yzFinalImage =
            document.getElementById(
                "yzFinalImage"
            );

        const yzTestButton =
            document.getElementById(
                "yzTestButton"
            );

        const yzLoadingVideo =
            document.getElementById(
                "yzLoadingVideo"
            );

        let yz2TransitionStarted = false;

        setTimeout(() => {
            yzBaseImage.src =
                "img/sy/23.png";
        }, 500);

        setTimeout(() => {
            yzBaseImage.src =
                "img/sy/24.png";
        }, 1200);

        function slideToYz2Page() {
            if (yz2TransitionStarted) return;
            yz2TransitionStarted = true;

            const frame =
                document.createElement("iframe");

            frame.className =
                "yz2-transition-layer";

            frame.src = "yz2.html";
            frame.setAttribute("aria-hidden", "true");

            document.body.appendChild(frame);

            let started = false;

            const startSlide = () => {
                if (started) return;
                started = true;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        frame.classList.add("show");
                    });
                });

                setTimeout(() => {
                    window.location.replace("yz2.html");
                }, 400);
            };

            frame.addEventListener(
                "load",
                startSlide,
                { once: true }
            );

            setTimeout(startSlide, 300);
        }

        yzTestButton.addEventListener("click", async () => {
            if (yz2TransitionStarted) return;

            yzTestButton.disabled = true;

            yzLoadingVideo.classList.add("show");
            yzLoadingVideo.currentTime = 0;

            try {
                await yzLoadingVideo.play();
            } catch (error) {
                console.warn(
                    "27.mp4 播放失败:",
                    error
                );
            }

            const randomDelay =
                500 + Math.random() * 2500;

            setTimeout(() => {
                slideToYz2Page();
            }, randomDelay);
        });

        setTimeout(() => {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    yzFinalImage
                        .classList
                        .add("show");

                    yzTestButton
                        .classList
                        .add("show");
                });
            });
        }, 1800);
    </script>

</body>

</html>
