<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PWA 离线安装</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#0b0b0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
    body{padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
    .card{max-width:560px;margin:0 auto;padding:24px;border-radius:22px;background:#171719;border:1px solid rgba(255,255,255,.08)}
    h1{margin:0 0 8px;font-size:28px}
    .sub{margin:0 0 24px;color:rgba(255,255,255,.62);font-size:14px;line-height:1.6}
    .status{font-size:16px;margin-bottom:12px}
    .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
    .fill{height:100%;width:0;background:#fff;border-radius:inherit;transition:width .18s ease}
    .count{margin-top:10px;color:rgba(255,255,255,.62);font-size:13px}
    .log{margin-top:18px;max-height:240px;overflow:auto;padding:12px;border-radius:14px;background:#0d0d0f;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
    .actions{display:flex;gap:10px;margin-top:18px}
    button,a.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;text-decoration:none;text-align:center;flex:1}
    button{background:#fff;color:#000}
    button:disabled{opacity:.35}
    a.btn{background:#2a2a2d;color:#fff;pointer-events:none;opacity:.35}
    a.btn.ready{pointer-events:auto;opacity:1}
    .ok{color:#7dff9b}.bad{color:#ff7b7b}
  </style>
</head>
<body>
  <div class="card">
    <h1>离线安装</h1>
    <p class="sub">先把这个页面通过真正可信的 HTTPS 打开。安装器会把核心页面和资源缓存到 iPhone，完成后再“添加到主屏幕”。</p>

    <div class="status" id="status">准备中…</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">0 / 0</div>
    <div class="log" id="log">等待开始…</div>

    <div class="actions">
      <button id="startBtn">开始离线安装</button>
      <a id="openBtn" class="btn" href="./index.html">打开应用</a>
    </div>
  </div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const statusEl = $("#status");
  const fillEl = $("#fill");
  const countEl = $("#count");
  const logEl = $("#log");
  const startBtn = $("#startBtn");
  const openBtn = $("#openBtn");

  function log(line, cls="") {
    const span = document.createElement("div");
    span.textContent = line;
    if (cls) span.className = cls;
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(done, total) {
    countEl.textContent = `${done} / ${total}`;
    fillEl.style.width = total ? `${Math.round(done / total * 100)}%` : "0%";
  }

  async function installOffline() {
    startBtn.disabled = true;
    openBtn.classList.remove("ready");
    logEl.textContent = "";
    statusEl.textContent = "正在注册 Service Worker…";

    if (!("serviceWorker" in navigator)) {
      statusEl.textContent = "当前浏览器不支持 Service Worker";
      log("Service Worker 不可用", "bad");
      startBtn.disabled = false;
      return;
    }

    try {
      await navigator.serviceWorker.register("./sw.js", { scope: "./" });
      await navigator.serviceWorker.ready;

      // 确保当前页真正被 SW 接管
      if (!navigator.serviceWorker.controller) {
        statusEl.textContent = "已注册，正在接管页面…";
        log("首次注册需要重新加载一次页面。");
        setTimeout(() => location.reload(), 500);
        return;
      }

      statusEl.textContent = "正在缓存全部资源…";

      const channel = new MessageChannel();

      const finished = new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("安装超时")), 180000);

        channel.port1.onmessage = event => {
          const data = event.data || {};

          if (data.type === "START") {
            setProgress(0, data.total || 0);
            log(`共发现 ${data.total || 0} 个资源`);
          }

          if (data.type === "PROGRESS") {
            setProgress(data.done || 0, data.total || 0);
            log(`${data.ok ? "✓" : "✕"} ${data.url}`, data.ok ? "ok" : "bad");
          }

          if (data.type === "DONE") {
            clearTimeout(timeout);
            resolve(data);
          }

          if (data.type === "ERROR") {
            clearTimeout(timeout);
            reject(new Error(data.message || "安装失败"));
          }
        };
      });

      navigator.serviceWorker.controller.postMessage({
        type: "CACHE_ALL",
        seeds: [
          "./",
          "./index.html",
          "./sys.html",
          "./yz.html",
          "./yz2.html",
          "./yz3.html",
          "./manifest.json",
          "./img/sy/11.png",
          "./img/sy/12.jpg",
          "./img/sy/13.jpg",
          "./img/sy/14.png",
          "./img/sy/15.png",
          "./img/sy/16.png",
          "./img/sy/17.png",
          "./img/sy/18.png",
          "./img/sy/19.png",
          "./img/sy/20.png",
          "./img/sy/21.png",
          "./img/sy/22.png",
          "./img/sy/23.png",
          "./img/sy/24.png",
          "./img/sy/25.png",
          "./img/sy/26.png",
          "./img/sy/27.mp4",
          "./img/sy/28.png",
          "./img/sy/29.png",
          "./img/sy/30.png",
          "./img/sy/31.png",
          "./img/sy/32.png",
          "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
        ]
      }, [channel.port2]);

      const result = await finished;

      if (result.failed && result.failed.length) {
        statusEl.textContent = `缓存完成，但有 ${result.failed.length} 个资源失败`;
        log("失败项可以在上面的记录里看到。", "bad");
      } else {
        statusEl.textContent = "离线资源准备完成";
        log("✓ 全部核心资源已缓存。", "ok");
      }

      openBtn.classList.add("ready");
      startBtn.disabled = false;

    } catch (err) {
      statusEl.textContent = "安装失败";
      log(String(err && err.message ? err.message : err), "bad");
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener("click", installOffline);
})();
</script>
</body>
</html>
