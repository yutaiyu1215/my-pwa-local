<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>验证结果</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #FFFFFF;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .yz3-page {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #FFFFFF;
        }

        .yz3-underlay-image,
        .yz3-slide-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .yz3-slide-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform: translateX(0);
        }

        .yz3-slide-layer.slide-right {
            transform: translateX(100%);
            transition: transform 0.36s cubic-bezier(.22, 1, .36, 1);
            will-change: transform;
        }

        .yz3-slide-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .yz3-image-30 {
            z-index: 1;
        }

        .yz3-image-31 {
            z-index: 2;
            opacity: 0;
        }

        .yz3-image-31.show {
            opacity: 1;
        }

        @media (display-mode: standalone) {

            html,
            body {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
                background: #FFFFFF;
            }

            body {
                position: fixed;
                inset: 0;
            }

            .yz3-page {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100vh;
                overflow: hidden;
            }
        }
    </style>
</head>

<body>

    <main class="yz3-page">

        <!-- 底层：一开始就是 24.png -->
        <img class="yz3-underlay-image" id="yz3UnderlayImage" src="img/sy/24.png" alt="">

        <!-- 30 和 31 同时保留在这个共同滑动层里 -->
        <div class="yz3-slide-layer" id="yz3SlideLayer">
            <img class="yz3-slide-image yz3-image-30" src="img/sy/30.png" alt="">
            <img class="yz3-slide-image yz3-image-31" id="yz3Image31" src="img/sy/31.png" alt="">
        </div>

    </main>

    <script>
        const yz3UnderlayImage =
            document.getElementById(
                "yz3UnderlayImage"
            );

        const yz3SlideLayer =
            document.getElementById(
                "yz3SlideLayer"
            );

        const yz3Image31 =
            document.getElementById(
                "yz3Image31"
            );

        const switchTo31Delay =
            100 + Math.random() * 500;

        setTimeout(() => {
            yz3Image31.classList.add("show");

            setTimeout(() => {
                yz3SlideLayer.classList.add(
                    "slide-right"
                );

                setTimeout(() => {
                    const switchTo32Delay =
                        400 + Math.random() * 600;

                    setTimeout(() => {
                        yz3UnderlayImage.src =
                            "img/sy/32.png";
                    }, switchTo32Delay);
                }, 380);
            }, 1000);
        }, switchTo31Delay);
    </script>

</body>

</html>
