<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>扫一扫</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            color: #FFFFFF;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .camera-page {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            z-index: 1;
            transform: translateX(0);
        }

        .camera-preview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .camera-preview::-webkit-media-controls {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .camera-preview::-webkit-media-controls-panel,
        .camera-preview::-webkit-media-controls-play-button,
        .camera-preview::-webkit-media-controls-start-playback-button,
        .camera-preview::-webkit-media-controls-overlay-play-button {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            -webkit-appearance: none !important;
        }

        .camera-freeze-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 3;
            pointer-events: none;
        }

        .qr-detected-image {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 36px;
            height: 36px;
            object-fit: contain;
            display: none;
            z-index: 7;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0;
        }

        .qr-detected-image.show {
            display: block;
            animation: qrDetectedPop 0.28s cubic-bezier(.2, .9, .3, 1.25) forwards;
        }

        .yz-transition-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: #FFFFFF;
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.34s cubic-bezier(.22, 1, .36, 1);
            will-change: transform;
        }

        .yz-transition-layer.show {
            transform: translateX(0);
        }


        .index-underlay-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: #FFFFFF;
            z-index: 0;
            pointer-events: none;
        }

        .camera-page.exit-slide-right {
            transform: translateX(100%);
            transition: transform 0.34s cubic-bezier(.22, 1, .36, 1);
            will-change: transform;
        }

        @keyframes qrDetectedPop {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .camera-placeholder {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            font-size: 14px;
        }

        .scan-bottom-image {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: auto;
            display: block;
            transform: translateY(14%);
            z-index: 5;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .scan-mode-labels {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 220px;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.8;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }

        .scan-sweep-image {
            position: fixed;
            left: 50%;
            top: 18%;
            width: 90%;
            height: auto;
            display: block;
            transform: translateX(-50%);
            opacity: 0;
            z-index: 4;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            animation: scanSweep 1.7s ease-in-out infinite;
        }

        .scan-top-button {
            position: fixed;
            top: calc(18px + env(safe-area-inset-top));
            width: 36px;
            height: 36px;
            z-index: 12;
            border: 0;
            padding: 0;
            margin: 0;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .scan-top-button img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
            display: block;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .scan-exit-button {
            left: 10px;
        }

        .scan-exit-button img {
            width: 50%;
            height: 50%;
        }

        .scan-more-button {
            right: 10px;
        }

        .scan-more-button img {
            width: 70%;
            height: 70%;
        }


        .scan-bottom-glass-button {
            position: fixed;
            bottom: calc(100px + env(safe-area-inset-bottom));
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.16);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
            z-index: 13;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            pointer-events: none;
        }

        .scan-bottom-glass-button img {
            width: 55px;
            height: 55px;
            display: block;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .scan-bottom-glass-left {
            left: 26px;
        }

        .scan-bottom-glass-right {
            right: 26px;
        }

        @keyframes scanSweep {
            0% {
                top: 18%;
                opacity: 0;
            }

            12% {
                opacity: 1;
            }

            78% {
                opacity: 1;
            }

            100% {
                top: calc(100% - 355px);
                opacity: 0;
            }
        }

        /* PWA standalone iOS safe-area workaround */
        @media (display-mode: standalone) {

            html,
            body {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
                background: #000000;
            }

            body {
                position: fixed;
                inset: 0;
            }

            .camera-page {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100vh;
                overflow: hidden;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body>

    <iframe class="index-underlay-layer" id="indexUnderlayLayer" src="index.html" aria-hidden="true"></iframe>

    <main class="camera-page">

        <button class="scan-top-button scan-exit-button" id="scanExitButton" type="button" aria-label="退出扫码">
            <img src="img/sy/18.png" alt="">
        </button>

        <button class="scan-top-button scan-more-button" id="scanMoreButton" type="button" aria-label="更多">
            <img src="img/sy/19.png" alt="">
        </button>

        <video
            class="camera-preview"
            id="cameraPreview"
            autoplay
            muted
            playsinline
            webkit-playsinline
            disablepictureinpicture
            controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
        </video>
        <canvas class="camera-freeze-frame" id="cameraFreezeFrame"></canvas>
        <img class="qr-detected-image" id="qrDetectedImage" src="img/sy/17.png" alt="">

        <div class="camera-placeholder" id="cameraPlaceholder">
            正在打开摄像头…
        </div>
        <img class="scan-sweep-image" src="img/sy/16.png" alt="">

        <div class="scan-mode-labels">
            扫二维码/条码/小程序码
        </div>

        <div class="scan-bottom-glass-button scan-bottom-glass-left">
            <img src="img/sy/20.png" alt="">
        </div>

        <div class="scan-bottom-glass-button scan-bottom-glass-right">
            <img src="img/sy/21.png" alt="">
        </div>

        <img class="scan-bottom-image" src="img/sy/15.png" alt="">

    </main>

    <script>
        const cameraPreview =
            document.getElementById("cameraPreview");

        cameraPreview.controls = false;
        cameraPreview.muted = true;
        cameraPreview.autoplay = true;
        cameraPreview.playsInline = true;
        cameraPreview.setAttribute("playsinline", "");
        cameraPreview.setAttribute("webkit-playsinline", "");
        cameraPreview.setAttribute("disablepictureinpicture", "");
        cameraPreview.setAttribute("controlslist", "nodownload noplaybackrate nofullscreen noremoteplayback");

        cameraPreview.addEventListener("pause", () => {
            if (cameraPreview.srcObject) {
                cameraPreview.play().catch(() => {});
            }
        });

        cameraPreview.addEventListener("contextmenu", event => {
            event.preventDefault();
        });

        const cameraPlaceholder =
            document.getElementById("cameraPlaceholder");

        const cameraFreezeFrame =
            document.getElementById("cameraFreezeFrame");

        const cameraFreezeContext =
            cameraFreezeFrame.getContext("2d");
        const qrDetectedImage =
            document.getElementById("qrDetectedImage");

        const scanExitButton =
            document.getElementById("scanExitButton");

        const scanMoreButton =
            document.getElementById("scanMoreButton");

        const indexUnderlayLayer =
            document.getElementById("indexUnderlayLayer");

        let cameraStream = null;
        let qrDetector = null;
        let qrScanFrame = null;
        let qrDetected = false;
        let detectedQrCenter = null;

        const qrCanvas =
            document.createElement("canvas");

        const qrContext =
            qrCanvas.getContext("2d", {
                willReadFrequently: true
            });

        let lastQrScanTime = 0;

        function stopCamera() {
            stopQrScanning();
            if (!cameraStream) return;

            cameraStream
                .getTracks()
                .forEach(track => track.stop());

            cameraStream = null;
            cameraPreview.srcObject = null;
        }

        function hasLiveCameraStream() {
            if (!cameraStream) return false;

            const videoTracks =
                cameraStream.getVideoTracks();

            return videoTracks.some(
                track => track.readyState === "live"
            );
        }

        function stopQrScanning() {
            if (qrScanFrame) {
                cancelAnimationFrame(qrScanFrame);
                qrScanFrame = null;
            }
        }

        function freezeCurrentCameraFrame() {
            const sourceWidth = cameraPreview.videoWidth;
            const sourceHeight = cameraPreview.videoHeight;
            const displayWidth = cameraPreview.clientWidth;
            const displayHeight = cameraPreview.clientHeight;

            if (
                !sourceWidth ||
                !sourceHeight ||
                !displayWidth ||
                !displayHeight
            ) {
                return false;
            }

            const pixelRatio =
                window.devicePixelRatio || 1;

            cameraFreezeFrame.width =
                Math.round(displayWidth * pixelRatio);

            cameraFreezeFrame.height =
                Math.round(displayHeight * pixelRatio);

            const sourceAspect =
                sourceWidth / sourceHeight;

            const displayAspect =
                displayWidth / displayHeight;

            let sx = 0;
            let sy = 0;
            let sw = sourceWidth;
            let sh = sourceHeight;

            if (sourceAspect > displayAspect) {
                sw = sourceHeight * displayAspect;
                sx = (sourceWidth - sw) / 2;
            } else if (sourceAspect < displayAspect) {
                sh = sourceWidth / displayAspect;
                sy = (sourceHeight - sh) / 2;
            }

            cameraFreezeContext.clearRect(
                0,
                0,
                cameraFreezeFrame.width,
                cameraFreezeFrame.height
            );

            cameraFreezeContext.drawImage(
                cameraPreview,
                sx,
                sy,
                sw,
                sh,
                0,
                0,
                cameraFreezeFrame.width,
                cameraFreezeFrame.height
            );

            cameraFreezeFrame.style.display = "block";
            cameraPreview.style.visibility = "hidden";

            return true;
        }

        function clearFrozenCameraFrame() {
            cameraFreezeFrame.style.display = "none";
            cameraPreview.style.visibility = "visible";

            cameraFreezeContext.clearRect(
                0,
                0,
                cameraFreezeFrame.width,
                cameraFreezeFrame.height
            );
        }

        function getDisplayedQrPoint(sourceX, sourceY) {
            const sourceWidth = cameraPreview.videoWidth;
            const sourceHeight = cameraPreview.videoHeight;
            const displayWidth = cameraPreview.clientWidth;
            const displayHeight = cameraPreview.clientHeight;

            if (
                !sourceWidth ||
                !sourceHeight ||
                !displayWidth ||
                !displayHeight
            ) {
                return null;
            }

            const scale = Math.max(
                displayWidth / sourceWidth,
                displayHeight / sourceHeight
            );

            const renderedWidth = sourceWidth * scale;
            const renderedHeight = sourceHeight * scale;

            const offsetX =
                (displayWidth - renderedWidth) / 2;

            const offsetY =
                (displayHeight - renderedHeight) / 2;

            return {
                x: sourceX * scale + offsetX,
                y: sourceY * scale + offsetY
            };
        }

        function showQrDetectedImage() {
            if (!detectedQrCenter) return;

            const point =
                getDisplayedQrPoint(
                    detectedQrCenter.x,
                    detectedQrCenter.y
                );

            if (!point) return;

            qrDetectedImage.style.left =
                `${point.x}px`;

            qrDetectedImage.style.top =
                `${point.y}px`;

            qrDetectedImage.style.display = "block";
            qrDetectedImage.classList.remove("show");
            void qrDetectedImage.offsetWidth;
            qrDetectedImage.classList.add("show");
        }

        function clearQrDetectedImage() {
            qrDetectedImage.classList.remove("show");
            qrDetectedImage.style.display = "none";
            detectedQrCenter = null;
        }

        function slideToYzPage() {
            const frame = document.createElement("iframe");

            frame.className = "yz-transition-layer";
            frame.src = "yz.html";
            frame.setAttribute("aria-hidden", "true");

            document.body.appendChild(frame);

            const startSlide = () => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        frame.classList.add("show");
                    });
                });

                setTimeout(() => {
                    window.location.replace("yz.html");
                }, 380);
            };

            frame.addEventListener(
                "load",
                startSlide,
                { once: true }
            );

            setTimeout(() => {
                if (!frame.classList.contains("show")) {
                    startSlide();
                }
            }, 300);
        }

        async function startQrScanning() {
            stopQrScanning();

            if (qrDetected) return;


            const detectLoop = async timestamp => {
                if (
                    qrDetected ||
                    !hasLiveCameraStream()
                ) {
                    return;
                }

                if (
                    cameraPreview.readyState < 2 ||
                    !cameraPreview.videoWidth ||
                    !cameraPreview.videoHeight
                ) {
                    qrScanFrame =
                        requestAnimationFrame(
                            detectLoop
                        );
                    return;
                }

                if (
                    timestamp - lastQrScanTime < 90
                ) {
                    qrScanFrame =
                        requestAnimationFrame(
                            detectLoop
                        );
                    return;
                }

                lastQrScanTime = timestamp;

                let found = false;
                detectedQrCenter = null;

                // Always use jsQR as the primary scanner
                if (qrDetected) return;
                if (typeof window.jsQR !== "function") {
                    console.warn("jsQR 尚未加载，稍后重试二维码识别");

                    setTimeout(() => {
                        if (!qrDetected && hasLiveCameraStream()) {
                            startQrScanning();
                        }
                    }, 250);

                    return;
                }

                try {
                    const sourceWidth =
                        cameraPreview.videoWidth;

                    const sourceHeight =
                        cameraPreview.videoHeight;

                    const targetWidth = 720;

                    const targetHeight =
                        Math.max(
                            1,
                            Math.round(
                                sourceHeight *
                                targetWidth /
                                sourceWidth
                            )
                        );

                    qrCanvas.width =
                        targetWidth;

                    qrCanvas.height =
                        targetHeight;

                    qrContext.drawImage(
                        cameraPreview,
                        0,
                        0,
                        targetWidth,
                        targetHeight
                    );

                    const imageData =
                        qrContext.getImageData(
                            0,
                            0,
                            targetWidth,
                            targetHeight
                        );

                    const result =
                        window.jsQR(
                            imageData.data,
                            targetWidth,
                            targetHeight,
                            {
                                inversionAttempts:
                                    "attemptBoth"
                            }
                        );

                    found = Boolean(result);

                    if (
                        found &&
                        result.location
                    ) {
                        const corners = [
                            result.location.topLeftCorner,
                            result.location.topRightCorner,
                            result.location.bottomRightCorner,
                            result.location.bottomLeftCorner
                        ];

                        const canvasCenterX =
                            corners.reduce(
                                (sum, point) =>
                                    sum + point.x,
                                0
                            ) / corners.length;

                        const canvasCenterY =
                            corners.reduce(
                                (sum, point) =>
                                    sum + point.y,
                                0
                            ) / corners.length;

                        detectedQrCenter = {
                            x:
                                canvasCenterX *
                                sourceWidth /
                                targetWidth,
                            y:
                                canvasCenterY *
                                sourceHeight /
                                targetHeight
                        };
                    }
                } catch (error) {
                    console.warn(
                        "jsQR 识别失败:",
                        error
                    );
                }

                if (found) {
                    qrDetected = true;
                    stopQrScanning();

                    freezeCurrentCameraFrame();
                    showQrDetectedImage();

                    setTimeout(() => {
                        stopCamera();
                    }, 100);

                    setTimeout(() => {
                        slideToYzPage();
                    }, 1000);

                    return;
                }

                qrScanFrame =
                    requestAnimationFrame(
                        detectLoop
                    );
            };

            qrScanFrame =
                requestAnimationFrame(
                    detectLoop
                );
        }

        async function getCameraPermissionState() {
            if (
                !navigator.permissions ||
                !navigator.permissions.query
            ) {
                return "unknown";
            }

            try {
                const result =
                    await navigator.permissions.query({
                        name: "camera"
                    });

                return result.state || "unknown";
            } catch (error) {
                return "unknown";
            }
        }

        async function startCamera() {
            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {
                cameraPlaceholder.textContent =
                    "当前浏览器不支持摄像头访问";
                return;
            }

            if (hasLiveCameraStream()) {
                cameraPreview.srcObject = cameraStream;

                try {
                    await cameraPreview.play();
                } catch (error) {
                    console.warn(
                        "恢复摄像头预览失败:",
                        error
                    );
                }

                cameraPlaceholder.style.display =
                    "none";
                await startQrScanning();

                return;
            }

            const permissionState =
                await getCameraPermissionState();

            if (permissionState === "denied") {
                cameraPlaceholder.style.display =
                    "flex";

                cameraPlaceholder.textContent =
                    "摄像头权限已被关闭，请在系统设置中重新允许";

                return;
            }

            try {
                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });

                cameraPreview.srcObject =
                    cameraStream;

                await cameraPreview.play();

                cameraPlaceholder.style.display =
                    "none";
                qrDetected = false;
                await startQrScanning();

                try {
                    sessionStorage.setItem(
                        "cameraPermissionGranted",
                        "1"
                    );
                } catch (error) {
                    // Ignore storage failures.
                }

            } catch (error) {
                console.error(
                    "摄像头获取失败:",
                    error
                );

                cameraPlaceholder.style.display =
                    "flex";

                if (error.name === "NotAllowedError") {
                    cameraPlaceholder.textContent =
                        "请允许摄像头权限后再试";
                } else if (error.name === "NotFoundError") {
                    cameraPlaceholder.textContent =
                        "没有找到可用摄像头";
                } else if (error.name === "NotReadableError") {
                    cameraPlaceholder.textContent =
                        "摄像头当前可能被其他应用占用";
                } else {
                    cameraPlaceholder.textContent =
                        "摄像头打开失败";
                }
            }
        }

        scanExitButton.addEventListener("click", () => {
            const cameraPage =
                document.querySelector(".camera-page");

            if (
                cameraPage?.classList.contains(
                    "exit-slide-right"
                )
            ) {
                return;
            }

            stopQrScanning();

            let started = false;

            const startExitAnimation = () => {
                if (started) return;
                started = true;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        cameraPage?.classList.add(
                            "exit-slide-right"
                        );
                    });
                });

                setTimeout(() => {
                    stopCamera();
                    window.location.replace("index.html");
                }, 360);
            };

            if (
                indexUnderlayLayer &&
                indexUnderlayLayer.contentDocument?.readyState === "complete"
            ) {
                startExitAnimation();
                return;
            }

            if (indexUnderlayLayer) {
                indexUnderlayLayer.addEventListener(
                    "load",
                    startExitAnimation,
                    { once: true }
                );

                setTimeout(
                    startExitAnimation,
                    250
                );

                return;
            }

            startExitAnimation();
        });

        scanMoreButton.addEventListener("click", () => {
            // Reserved for future functionality.
        });

        window.addEventListener(
            "pagehide",
            event => {
                if (event.persisted) {
                    return;
                }

                stopCamera();
            }
        );

        window.addEventListener(
            "pageshow",
            async () => {
                clearFrozenCameraFrame();
                clearQrDetectedImage();
                document
                    .querySelector(".camera-page")
                    ?.classList.remove(
                        "exit-slide-right"
                    );
                if (hasLiveCameraStream()) {
                    cameraPreview.srcObject =
                        cameraStream;

                    try {
                        await cameraPreview.play();
                    } catch (error) {
                        console.warn(
                            "恢复摄像头预览失败:",
                            error
                        );
                    }

                    cameraPlaceholder.style.display =
                        "none";
                    qrDetected = false;
                    await startQrScanning();

                    return;
                }

                await startCamera();
            }
        );
    </script>

</body>

</html>
